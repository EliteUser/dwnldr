limit_req_zone $binary_remote_addr zone=site_limit:1m rate=120r/m;

server_tokens off;
map $http_user_agent $safe_user_agent {
    default "";
    "~^(?<truncated_user_agent>.{0,256})" $truncated_user_agent;
}
map $status $rate_limit_retry_after {
    default "";
    429 60;
}

log_format safe_access escape=json
    '{"clientIp":"$remote_addr","method":"$request_method","path":"$uri","userAgent":"$safe_user_agent",'
    '"status":$status,"responseType":"$sent_http_content_type","responseSize":$body_bytes_sent,'
    '"duration":$request_time,"rateLimitStatus":"$limit_req_status"}';
error_log /dev/stderr crit;

server {
    listen 80 default_server;
    server_name ${TLS_HOST};
    access_log /dev/stdout safe_access;

    if ($host != "${TLS_HOST}") {
        return 444;
    }

    if ($request_method !~ ^(GET|HEAD|POST)$) {
        return 405;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location ~ /\.(?!well-known(?:/|$)) {
        return 404;
    }

    location / {
        return 301 https://${TLS_HOST}$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    server_name ${TLS_HOST};
    access_log /dev/stdout safe_access;
    auth_basic "dwnldr";
    auth_basic_user_file /etc/nginx/auth.htpasswd;

    if ($host != "${TLS_HOST}") {
        return 444;
    }

    if ($request_method !~ ^(GET|HEAD|POST)$) {
        return 405;
    }

    ssl_certificate /etc/ssl/certs/server.crt;
    ssl_certificate_key /etc/ssl/private/server.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=(), payment=(), usb=()" always;
    add_header Retry-After $rate_limit_retry_after always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "";

    client_max_body_size 10m;
    limit_req_status 429;
    error_page 429 = @rate_limited;

    location @rate_limited {
        default_type application/json;
        return 429 '{"error":"Too many requests. Try again shortly.","code":"RATE_LIMITED"}';
    }

    location ~ /\.(?!well-known(?:/|$)) {
        return 404;
    }

    location ~* ^/(?:health|ready)/?$ {
        return 404;
    }

    location ~* ^/api/artwork/?$ {
        limit_req zone=site_limit burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    location ~* ^/api/download/?$ {
        limit_req zone=site_limit burst=60 nodelay;
        client_max_body_size 10m;
        proxy_pass http://127.0.0.1:3000;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location ~* ^/api/(?:tracks|(?:soundcloud|youtube)/tracks)/?$ {
        limit_req zone=site_limit burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location ~* ^/api/meta(?:/|$) {
        limit_req zone=site_limit burst=60 nodelay;
        client_max_body_size 160m;
        proxy_pass http://127.0.0.1:3000;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location ~* ^/api/ {
        limit_req zone=site_limit burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        limit_req zone=site_limit burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }
}
