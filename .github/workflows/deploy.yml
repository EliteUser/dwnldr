name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - master

env:
  IMAGE_NAME: ghcr.io/eliteuser/dwnldr

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.34.7

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.0
          cache: pnpm

      - name: Verify project
        run: |
          pnpm install --frozen-lockfile
          pnpm check

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        run: |
          echo "IMAGE_REF=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_ENV"
          docker build --tag "${IMAGE_NAME}:${GITHUB_SHA}" .
          docker push "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Load deployment SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DWNLDR_DEPLOY_KEY }}

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DWNLDR_DEPLOY_HOST }}
          SERVER_IP: ${{ secrets.DWNLDR_PUBLIC_IP || secrets.DWNLDR_DEPLOY_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTH_HTPASSWD: ${{ secrets.DWNLDR_AUTH_HTPASSWD }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$SERVER_IP"
          test -n "$AUTH_HTPASSWD"
          if [[ ! "$AUTH_HTPASSWD" =~ ^owner:\$2[aby]\$[0-9]{2}\$[./A-Za-z0-9]{53}$ ]]; then
              echo "DWNLDR_AUTH_HTPASSWD must be a bcrypt htpasswd entry for owner." >&2
              exit 1
          fi

          install -d -m 700 ~/.ssh
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh "root@$DEPLOY_HOST" 'mkdir -p /opt/dwnldr'
          scp compose.yaml "root@$DEPLOY_HOST:/opt/dwnldr/compose.yaml"
          printf '%s\n' "$AUTH_HTPASSWD" | ssh "root@$DEPLOY_HOST" '
              set -e
              install -d -m 700 /opt/dwnldr
              temp_file="$(mktemp /opt/dwnldr/auth.htpasswd.XXXXXX)"
              cat > "$temp_file"
              chown 0:33 "$temp_file"
              chmod 640 "$temp_file"
              mv -f "$temp_file" /opt/dwnldr/auth.htpasswd
          '

          printf '%s' "$GHCR_TOKEN" | \
            ssh "root@$DEPLOY_HOST" "docker login ghcr.io --username '$GITHUB_ACTOR' --password-stdin"

          ssh "root@$DEPLOY_HOST" bash -s -- "$IMAGE_REF" "$SERVER_IP" <<'REMOTE'
          set -e
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

          cd /opt/dwnldr
          printf 'IMAGE_REF=%s\nSERVER_IP=%s\n' "$1" "$2" > .env

          if ! docker compose version >/dev/null 2>&1; then
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y docker-compose-plugin || apt-get install -y docker-compose-v2
          fi

          docker compose version

          for container_id in $(docker ps --all --quiet --filter label=com.docker.compose.project=dwnldr); do
              container_name="$(docker inspect --format '{{.Name}}' "$container_id")"
              if [ "$container_name" != /dwnldr ]; then
                  docker rm --force "$container_id"
              fi
          done

          if docker inspect dwnldr >/dev/null 2>&1; then
              project="$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project"}}' dwnldr 2>/dev/null || true)"
              if [ "$project" != dwnldr ]; then
                  docker rm -f dwnldr
              fi
          fi

          docker compose pull
          docker compose up --detach --force-recreate --remove-orphans

          for attempt in $(seq 1 60); do
              if docker exec dwnldr node -e "fetch('http://127.0.0.1:3000/ready').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))" >/dev/null 2>&1; then
                  break
              fi
              sleep 2
          done

          docker exec dwnldr nginx -t
          docker exec --user www-data dwnldr test -r /etc/nginx/auth.htpasswd
          docker exec dwnldr /usr/local/bin/yt-dlp --version
          docker exec dwnldr node -e "fetch('http://127.0.0.1:3000/ready').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
          test "$(docker exec dwnldr curl --insecure --silent --output /dev/null --write-out '%{http_code}' --resolve "$2:443:127.0.0.1" "https://$2/")" = 401
          REMOTE
