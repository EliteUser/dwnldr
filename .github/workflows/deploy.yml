name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - master

env:
  IMAGE_NAME: ghcr.io/eliteuser/dwnldr

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.34.7

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.0
          cache: pnpm

      - name: Verify project
        run: |
          pnpm install --frozen-lockfile
          pnpm check

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        run: |
          echo "IMAGE_REF=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_ENV"
          docker build --tag "${IMAGE_NAME}:${GITHUB_SHA}" .
          docker push "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Load deployment SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DWNLDR_DEPLOY_KEY }}

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DWNLDR_DEPLOY_HOST }}
          SERVER_IP: ${{ secrets.DWNLDR_PUBLIC_IP || secrets.DWNLDR_DEPLOY_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTH_HTPASSWD: ${{ secrets.DWNLDR_AUTH_HTPASSWD }}
          KNOWN_HOSTS: ${{ secrets.DWNLDR_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$SERVER_IP"
          test -n "$KNOWN_HOSTS"
          if [[ ! "$AUTH_HTPASSWD" =~ ^owner:\$2[aby]\$[0-9]{2}\$[./A-Za-z0-9]{53}$ ]]; then
              echo "DWNLDR_AUTH_HTPASSWD must be a bcrypt htpasswd entry for owner." >&2
              exit 1
          fi
          # Caddy's basic_auth takes the bare bcrypt hash.
          AUTH_HASH="${AUTH_HTPASSWD#owner:}"

          install -d -m 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh "root@$DEPLOY_HOST" 'mkdir -p /opt/dwnldr'
          scp compose.yaml Caddyfile "root@$DEPLOY_HOST:/opt/dwnldr/"

          printf '%s' "$GHCR_TOKEN" | \
            ssh "root@$DEPLOY_HOST" "docker login ghcr.io --username '$GITHUB_ACTOR' --password-stdin"

          ssh "root@$DEPLOY_HOST" bash -s -- "$IMAGE_REF" "$SERVER_IP" "$AUTH_HASH" <<'REMOTE'
          set -euo pipefail
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

          cd /opt/dwnldr
          # Single quotes keep compose from interpolating the $ signs in the bcrypt hash.
          printf "IMAGE_REF=%s\nSERVER_IP=%s\nAUTH_HASH='%s'\n" "$1" "$2" "$3" > .env
          chmod 600 .env

          docker compose pull
          docker compose up --detach --remove-orphans

          # The site must answer over HTTPS and ask for the password.
          for attempt in $(seq 1 60); do
              status="$(curl --insecure --silent --output /dev/null --write-out '%{http_code}' --resolve "$2:443:127.0.0.1" "https://$2/" || true)"
              [ "$status" = 401 ] && exit 0
              sleep 2
          done
          echo "The site did not answer with 401 over HTTPS (last status: $status)." >&2
          docker compose logs --tail 50
          exit 1
          REMOTE
