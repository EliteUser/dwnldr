name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - master

env:
  IMAGE_NAME: ghcr.io/eliteuser/dwnldr

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Verify project
        run: |
          pnpm install --frozen-lockfile
          pnpm check

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        run: |
          echo "IMAGE_REF=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_ENV"
          docker build --tag "${IMAGE_NAME}:${GITHUB_SHA}" .
          docker push "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Load deployment SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DWNLDR_DEPLOY_KEY }}

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DWNLDR_DEPLOY_HOST }}
          SERVER_IP: ${{ secrets.DWNLDR_PUBLIC_IP || secrets.DWNLDR_DEPLOY_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$SERVER_IP"

          install -d -m 700 ~/.ssh
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh "root@$DEPLOY_HOST" 'mkdir -p /opt/dwnldr'
          scp compose.yaml "root@$DEPLOY_HOST:/opt/dwnldr/compose.yaml"

          printf '%s' "$GHCR_TOKEN" | \
            ssh "root@$DEPLOY_HOST" "docker login ghcr.io --username '$GITHUB_ACTOR' --password-stdin"

          ssh "root@$DEPLOY_HOST" bash -s -- "$IMAGE_REF" "$SERVER_IP" <<'REMOTE'
          set -e
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

          cd /opt/dwnldr
          printf 'IMAGE_REF=%s\nSERVER_IP=%s\n' "$1" "$2" > .env

          if ! docker compose version >/dev/null 2>&1; then
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y docker-compose-plugin || apt-get install -y docker-compose-v2
          fi

          docker compose version

          if docker inspect dwnldr >/dev/null 2>&1; then
              project="$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project"}}' dwnldr 2>/dev/null || true)"
              if [ "$project" != dwnldr ]; then
                  docker rm -f dwnldr
              fi
          fi

          docker compose pull
          docker compose up --detach --remove-orphans
          REMOTE
