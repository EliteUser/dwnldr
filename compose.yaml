services:
  app:
    image: ${IMAGE_REF}
    restart: unless-stopped
    # No published ports: only Caddy reaches the app, over the compose network.
    volumes:
      - state:/var/lib/dwnldr

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
    environment:
      SERVER_IP: ${SERVER_IP}
      AUTH_HASH: ${AUTH_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  state:
    name: dwnldr-state
  caddy-data:
    name: dwnldr-caddy-data
